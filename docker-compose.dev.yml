# Explicit project name so this stack (containers, network) never collides
# with docker-compose.yml's production-style stack — they default to the
# same name (the directory name) otherwise, which lets `up` on one silently
# replace the other's running containers, and lets a `down -v` on the wrong
# file take out the other stack's volumes.
name: dobby-dev

services:
  app:
    build:
      context: .
      target: dev
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  # Tunnels app:3000 to a stable public URL for the LINE webhook.
  # Needs .env.ngrok with NGROK_AUTHTOKEN and NGROK_DOMAIN (see .env.ngrok.example).
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    env_file:
      - .env.ngrok
    command: ["http", "app:3000", "--domain=${NGROK_DOMAIN}"]
    depends_on:
      - app
    ports:
      - "4040:4040" # ngrok inspector: http://localhost:4040
