version: '3.8'
# Explicit project name — see docker-compose.dev.yml for why this matters
# (keeps this stack's containers/volumes isolated from the dev stack).
name: dobby
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  logs:
